name: Update EPK 2027 booking contact
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-epk-2027-booking.yml'
permissions:
  contents: write
jobs:
  replace-epk-contact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF editing library
        run: python -m pip install PyMuPDF==1.26.7
      - name: Replace booking email in official 2027 EPK
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import fitz
          source = Path("assets/EPK 2027.pdf")
          original = source.read_bytes()
          expected = "061dabd0eb2dfe73fc99159ff4f799c0d9e3c3b6cb5c867b5d62cce036cd20e7"
          assert hashlib.sha256(original).hexdigest() == expected, "Unexpected PDF version; refusing to edit"
          doc = fitz.open(stream=original, filetype="pdf")
          assert len(doc) == 10
          page = doc[8]
          old = "erzsebetband@gmail.com"
          new = "booking@erzsebetmusic.com"
          matches = page.search_for(old)
          assert len(matches) == 1
          found = []
          for block in page.get_text("dict")["blocks"]:
              if block["type"] == 0:
                  for line in block["lines"]:
                      found.extend(span for span in line["spans"] if span["text"] == old)
          assert len(found) == 1
          span = found[0]
          font_xref = next(row[0] for row in page.get_fonts(full=True) if row[3].endswith("+Cinzel") and row[2] == "TrueType")
          font_bytes = doc.extract_font(font_xref)[-1]
          font = fitz.Font(fontbuffer=font_bytes)
          width = font.text_length(new, fontsize=span["size"])
          x = 668.7 - width / 2
          page.add_redact_annot(matches[0], fill=False, cross_out=False)
          page.apply_redactions(images=0, graphics=0, text=0)
          page.insert_font(fontname="CinzelRestored", fontbuffer=font_bytes)
          page.insert_text((x, span["origin"][1]), new, fontsize=span["size"], fontname="CinzelRestored", color=(1, 1, 1), overlay=True)
          assert old not in "".join(p.get_text() for p in doc)
          assert new in page.get_text()
          tmp = source.with_suffix(".updated.pdf")
          doc.save(str(tmp), garbage=4, deflate=True)
          doc.close()
          tmp.replace(source)
          print("EPK updated; file size:", source.stat().st_size)
          PY
      - name: Commit the updated PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "assets/EPK 2027.pdf"
          git commit -m "Update 2027 EPK contact to booking@erzsebetmusic.com [skip ci]"
          git push origin HEAD:main
