<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#070707">
  <meta name="description" content="Erzsébet — Symphonic Black Metal from Barcelona">
  <title>Erzsébet — Official Website</title>
  <style>
    :root{--gold:#b89a60;--ink:#f2f0e9;--line:rgba(255,255,255,.12)}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:#070707;color:var(--ink)}
    body{font-family:Arial,Helvetica,sans-serif}
    a{color:inherit;text-decoration:none}
    .hero{position:relative;min-height:100svh;overflow:hidden;display:grid;place-items:center;background:#0a0a0a url('./assets/hero.jpg') center center/cover no-repeat}
    .hero::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.36),rgba(0,0,0,.12) 48%,rgba(0,0,0,.55)),linear-gradient(90deg,rgba(0,0,0,.28),transparent 34%,transparent 66%,rgba(0,0,0,.28))}
    header{position:absolute;z-index:3;top:0;left:0;right:0;height:76px;padding:0 5vw;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);background:linear-gradient(180deg,rgba(0,0,0,.62),rgba(0,0,0,0))}
    .monogram{width:38px;height:38px;display:grid;place-items:center;border:1px solid rgba(184,154,96,.7);font-family:Georgia,serif;font-size:23px;color:var(--gold)}
    nav{display:flex;gap:28px;font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:#d7d3ca}
    nav a{opacity:.75;transition:.2s ease}nav a:hover{opacity:1;color:#fff}
    .center{position:relative;z-index:2;width:min(980px,78vw);display:flex;flex-direction:column;align-items:center;text-align:center;transform:translateY(2vh)}
    .logo{display:block;width:min(900px,100%);height:auto;max-height:48vh;object-fit:contain;filter:drop-shadow(0 10px 22px rgba(0,0,0,.72))}
    .tagline{margin:22px 0 0;font-family:Georgia,'Times New Roman',serif;font-size:clamp(10px,1vw,13px);font-weight:400;letter-spacing:.42em;text-transform:uppercase;color:#d0b273;text-shadow:0 1px 12px #000}
    .rule{width:74px;height:1px;background:var(--gold);margin-top:25px;opacity:.8}
    .scroll{position:absolute;z-index:2;bottom:24px;left:50%;transform:translateX(-50%);font-size:8px;letter-spacing:.36em;text-transform:uppercase;color:rgba(255,255,255,.58)}
    @media(max-width:780px){header{height:64px;padding:0 20px}.monogram{width:34px;height:34px;font-size:20px}nav{display:none}.hero{background-position:52% center}.center{width:92vw;transform:none}.logo{width:94%;max-height:42vh}.tagline{max-width:90%;line-height:1.8;letter-spacing:.3em;margin-top:16px}.rule{margin-top:18px}.scroll{bottom:16px}}
  </style>
</head>
<body>
  <section class="hero" aria-label="Erzsébet home">
    <header>
      <a class="monogram" href="#" aria-label="Erzsébet home">E</a>
      <nav aria-label="Main navigation">
        <a href="#music">Music</a><a href="#live">Live</a><a href="#band">Band</a><a href="#discography">Discography</a><a href="#videos">Videos</a><a href="#contact">Contact</a>
      </nav>
    </header>
    <div class="center">
      <img class="logo" src="./assets/logo.png" alt="Erzsébet">
      <p class="tagline">Symphonic Black Metal · Barcelona</p>
      <span class="rule" aria-hidden="true"></span>
    </div>
    <span class="scroll">Scroll</span>
  </section>
</body>
</html>
